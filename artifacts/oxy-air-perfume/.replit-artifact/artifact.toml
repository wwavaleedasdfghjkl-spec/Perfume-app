kind = "web"
previewPath = "/"
title = "OXY Air Perfume"
description = "A luxurious Arabic-first perfume brand landing page for OXY Air Perfume, featuring brand storytelling, product browsing, Iraqi dinar pricing, a shopping cart, and WhatsApp ordering."
version = "1.0.0"
id = "artifacts/oxy-air-perfume"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21457

[services.development]
run = "pnpm --filter @workspace/oxy-air-perfume run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oxy-air-perfume", "run", "build" ]
serve = "static"
publicDir = "artifacts/oxy-air-perfume/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21457"
BASE_PATH = "/"
